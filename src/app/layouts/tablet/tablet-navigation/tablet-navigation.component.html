<!-- 'fixed', no 'sticky': ver desktop-header.component.html -- un ancestro con display:flex
     rompe position:sticky en Chromium. h-12 fijo para que tablet-layout pueda reservarle
     un padding-top exacto. -->
<nav class="h-12 bg-slate-900 text-white px-4 flex items-center fixed top-16 left-0 right-0 z-30 border-b border-slate-800">
  <div class="flex items-center gap-3">
    <button
      type="button"
      (click)="toggleSidebar()"
      class="p-2 hover:bg-slate-800 rounded-lg text-slate-300"
      aria-label="Abrir menú de navegación"
    >
      <span class="text-2xl">☰</span>
    </button>

    <span class="text-sm font-semibold text-slate-300">Menú</span>
  </div>
</nav>

<!-- Sidebar Compartido -->
<app-shared-sidebar 
  [isOpen]="sidebarOpen()" 
  (closeSidebar)="sidebarOpen.set(false)">
</app-shared-sidebar>
