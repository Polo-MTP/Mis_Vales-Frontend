<header class="h-16 shrink-0 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between">

  <div>
    <a
      [routerLink]="['/']"
      class="text-xl font-black text-slate-100 tracking-tight"
    >
      Mis Vales
    </a>
  </div>

  <div class="flex items-center gap-4">

    <div class="text-right">
      <p class="text-sm font-semibold text-slate-100">
        {{ authService.currentUser()?.name }}
      </p>
      <p class="text-xs text-slate-400">
        {{ authService.userRole() }}
      </p>
    </div>

    <button
      type="button"
      (click)="logout()"
      class="btn-outline"
    >
      Cerrar sesión
    </button>

  </div>

</header>
