<header class="h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between sticky top-0 z-40">

  <a
    [routerLink]="homeRoute"
    class="font-bold text-lg text-slate-800"
  >
    Mis Vales
  </a>

  <div class="flex items-center gap-2">

    <div class="text-right">
      <p class="text-xs font-semibold text-slate-800">
        {{ authService.currentUser()?.name }}
      </p>

      <p class="text-[10px] text-slate-500">
        {{ authService.userRole() }}
      </p>
    </div>

    <button
      type="button"
      (click)="logout()"
      class="p-2 rounded-lg text-red-600 hover:bg-red-50"
      aria-label="Cerrar sesión"
    >
      ⎋
    </button>

  </div>

</header>
