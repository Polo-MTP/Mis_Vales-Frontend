<header class="h-14 bg-slate-900 border-b border-slate-800 px-4 flex items-center gap-2 sticky top-0 z-40">

  <div class="shrink-0">
    <app-brand-logo [to]="homeRoute"></app-brand-logo>
  </div>

  <div class="flex items-center gap-1 ml-auto min-w-0">

    <div class="text-right min-w-0">
      <p class="text-xs font-semibold text-slate-100 truncate">
        {{ authService.currentUser()?.name }}
      </p>

      <p class="text-[10px] text-slate-400 truncate">
        {{ authService.userRole() }}
      </p>
    </div>

    <div class="flex items-center shrink-0">
      <app-notification-bell></app-notification-bell>

      <a
        routerLink="/distribuidora/cuenta/contrasena"
        class="p-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-slate-200"
        aria-label="Cambiar contraseña"
        title="Cambiar contraseña"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"/>
        </svg>
      </a>

      <button
        type="button"
        (click)="logout()"
        class="p-2 rounded-lg text-red-400 hover:bg-red-500/10"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
      >
        ⎋
      </button>
    </div>

  </div>

</header>
