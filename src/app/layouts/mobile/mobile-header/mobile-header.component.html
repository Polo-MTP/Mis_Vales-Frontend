<header class="h-14 bg-slate-900 border-b border-slate-800 px-4 flex items-center justify-between sticky top-0 z-40">

  <a
    [routerLink]="homeRoute"
    class="font-black text-lg text-slate-100 tracking-tight"
  >
    Mis Vales
  </a>

  <div class="flex items-center gap-2">

    <app-notification-bell></app-notification-bell>

    <div class="text-right">
      <p class="text-xs font-semibold text-slate-100">
        {{ authService.currentUser()?.name }}
      </p>

      <p class="text-[10px] text-slate-400">
        {{ authService.userRole() }}
      </p>
    </div>

    <a
      routerLink="/distribuidora/cuenta/contrasena"
      class="px-2 py-1 rounded-lg text-[10px] font-semibold text-slate-400 hover:bg-slate-800 hover:text-slate-200"
      aria-label="Cambiar contraseña"
    >
      Clave
    </a>

    <button
      type="button"
      (click)="logout()"
      class="p-2 rounded-lg text-red-400 hover:bg-red-500/10"
      aria-label="Cerrar sesión"
    >
      ⎋
    </button>

  </div>

</header>
