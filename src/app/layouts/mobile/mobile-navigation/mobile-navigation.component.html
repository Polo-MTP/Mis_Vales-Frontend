<nav
  class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-slate-200"
>
  <div class="h-16 flex items-center justify-around">

    <!-- Menú (Izquierda) -->
    <button
      type="button"
      (click)="toggleSidebar()"
      class="flex flex-col items-center justify-center gap-1 text-slate-500 hover:text-blue-600"
    >
      <span class="text-xl">☰</span>
      <span class="text-[10px]">Menú</span>
    </button>

    <!-- Inicio -->
    <a
      routerLink="/distribuidora"
      routerLinkActive="text-blue-600"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex flex-col items-center justify-center gap-1 text-slate-500"
    >
      <span class="text-xl">⌂</span>
      <span class="text-[10px]">Inicio</span>
    </a>

    <!-- Clientes -->
    <a
      routerLink="/distribuidora/clientes"
      routerLinkActive="text-blue-600"
      class="flex flex-col items-center justify-center gap-1 text-slate-500"
    >
      <span class="text-xl">♙</span>
      <span class="text-[10px]">Clientes</span>
    </a>

    <!-- Pagos y Abonos -->
    <a
      routerLink="/distribuidora/pagos-abonos"
      routerLinkActive="text-blue-600"
      class="flex flex-col items-center justify-center gap-1 text-slate-500"
    >
      <span class="text-xl">💰</span>
      <span class="text-[10px]">Pagos y Abonos</span>
    </a>

  </div>
</nav>

<!-- Sidebar Compartido -->
<app-shared-sidebar 
  [isOpen]="sidebarOpen()" 
  (closeSidebar)="sidebarOpen.set(false)">
</app-shared-sidebar>
