<div class="relative">
  <button 
    type="button" 
    (click)="togglePanel()"
    class="p-2 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition relative"
  >
    <!-- Bell Icon (Heroicons outline) -->
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
    </svg>

    <!-- Unread indicator -->
    <span *ngIf="unreadCount() > 0" class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-slate-950"></span>
  </button>

  <app-notification-panel *ngIf="panelAbierto()" (closePanel)="cerrarPanel()"></app-notification-panel>
</div>
