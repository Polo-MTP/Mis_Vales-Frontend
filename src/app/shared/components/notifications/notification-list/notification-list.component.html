<div *ngIf="cargando()" class="state-loading">
  Cargando notificaciones...
</div>

<div
  *ngIf="!cargando() && error()"
  class="bg-red-950/40 text-red-300 border border-red-800/60 rounded-2xl p-4 text-sm"
>
  {{ error() }}
</div>

<div
  *ngIf="!cargando() && !error() && notificaciones().length === 0"
  class="state-empty"
>
  No hay notificaciones todavía.
</div>

<div
  *ngIf="!cargando() && !error() && notificaciones().length > 0"
  class="space-y-3"
>
  <!-- flex-col, no flex-row: en el panel de la campana (w-80) no cabe el texto al lado de la
       fecha -- el título heredaba 16px sin tamaño propio y la fecha ("8/24/26, 10:38 AM", ~96px)
       le dejaba a la etiqueta solo ~116px, así que cada palabra caía en su propia línea. -->
  <div
    *ngFor="let n of notificaciones()"
    (click)="marcarComoLeida(n)"
    class="list-card-item flex-col items-stretch gap-1"
    [class.cursor-default]="n.destinatario_id === null"
    [class.opacity-60]="n.leida"
  >
    <div class="flex items-start gap-2 min-w-0">
      <span *ngIf="n.destinatario_id !== null && !n.leida" class="w-2 h-2 rounded-full bg-blue-500 mt-1.5 shrink-0"></span>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-bold text-slate-100">
          {{ notificacionAccionLabel(n.accion) }}
        </p>

        <p class="text-xs text-slate-400 mt-0.5">
          {{ auditRecursoLabel(n.recurso) }}

          <span *ngIf="n.sucursal">
            · {{ n.sucursal.nombre }}
          </span>

          <span *ngIf="n.usuario">
            · {{ n.usuario.name }}
          </span>
        </p>
      </div>
    </div>

    <span class="text-xs text-slate-500">
      {{ n.created_at | date:'short' }}
    </span>
  </div>
</div>

<!-- Paginación -->
<app-pagination
  [currentPage]="paginacion()?.current_page ?? 1"
  [lastPage]="paginacion()?.last_page ?? 1"
  [loading]="cargando()"
  (pageChange)="cambiarPagina($event)"
></app-pagination>
