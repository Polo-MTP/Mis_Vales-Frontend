<!-- Overlay -->
<div 
  *ngIf="isOpen" 
  (click)="onClose()"
  class="fixed inset-0 bg-black/50 z-40 transition-opacity"
></div>

<!-- Sidebar content -->
<div 
  class="fixed top-0 bottom-0 left-0 w-64 bg-slate-900 text-white z-50 transform transition-transform duration-300 ease-in-out shadow-2xl overflow-y-auto"
  [class.-translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
>
  <div class="p-4 flex items-center justify-between border-b border-slate-800">
    <h2 class="text-xl font-bold">Menú Principal</h2>
    <button (click)="onClose()" class="text-slate-400 hover:text-white">
      ✕
    </button>
  </div>

  <nav class="p-4 space-y-2">
    <ng-container *ngFor="let item of menuItems">
      
      <!-- Item sin hijos -->
      <a *ngIf="!item.children" 
         [routerLink]="item.route" 
         (click)="onClose()"
         routerLinkActive="bg-blue-600 text-white" 
         [routerLinkActiveOptions]="{exact: true}"
         class="block px-4 py-2 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
        {{ item.label }}
      </a>

      <!-- Item con hijos -->
      <div *ngIf="item.children" class="space-y-1">
        <button 
          (click)="toggleSubmenu(item.label)"
          class="w-full flex items-center justify-between px-4 py-2 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
          <span>{{ item.label }}</span>
          <span [class.rotate-180]="submenuAbierto() === item.label" class="transition-transform duration-200">
            ▼
          </span>
        </button>
        
        <!-- Submenu -->
        <div *ngIf="submenuAbierto() === item.label" class="pl-4 space-y-1 mt-1">
          <a *ngFor="let child of item.children" 
             [routerLink]="child.route" 
             (click)="onClose()"
             routerLinkActive="bg-blue-600 text-white"
             class="block px-4 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
            {{ child.label }}
          </a>
        </div>
      </div>

    </ng-container>
  </nav>

  <div class="absolute bottom-0 w-full p-4 border-t border-slate-800">
    <button (click)="authService.logout()" class="w-full px-4 py-2 bg-red-600/10 text-red-500 rounded-lg hover:bg-red-600 hover:text-white transition-colors">
      Cerrar Sesión
    </button>
  </div>
</div>
