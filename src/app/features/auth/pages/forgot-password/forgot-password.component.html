<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center p-4">
  <div class="auth-card-wide">

    <div class="auth-form-container">

      <div class="text-left space-y-2">
        <div class="auth-header-icon">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
          </svg>
        </div>
        <h2 class="text-2xl font-black text-slate-100 tracking-tight">¿Olvidaste tu contraseña?</h2>
        <p class="text-xs text-slate-400 font-medium">Ingresa tu correo y te mandamos un enlace para restablecerla.</p>
      </div>

      <app-alert [message]="errorMessage()" type="error"></app-alert>
      <app-alert [message]="successMessage()" type="success"></app-alert>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="form-label">Correo Electrónico</label>
          <input type="email" formControlName="email" placeholder="tu@correo.com" class="form-input">
        </div>

        <button type="submit" [disabled]="form.invalid || isLoading()" class="btn-primary">
          <span *ngIf="!isLoading()">Enviar Enlace</span>
          <span *ngIf="isLoading()">Enviando...</span>
        </button>
      </form>

      <p class="text-xs text-slate-400 text-center">
        <a routerLink="/auth/login" class="text-blue-400 hover:text-blue-300 font-semibold">← Volver a Iniciar Sesión</a>
      </p>

    </div>

    <div class="auth-image-panel">
      <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop"
           alt="Ilustración de seguridad"
           class="absolute inset-0 w-full h-full object-cover opacity-80 mix-blend-overlay">

      <div class="auth-image-overlay">
        <div class="space-y-2">
          <span class="inline-block px-3 py-1 bg-blue-500/20 backdrop-blur-md border border-blue-400/30 rounded-full text-[11px] font-semibold text-blue-300">
            Autenticación Segura
          </span>
          <h3 class="text-2xl font-bold leading-snug">Protección de acceso multinivel</h3>
          <p class="text-xs text-slate-300 font-normal">Acceso cifrado y verificado por múltiples factores.</p>
        </div>
      </div>
    </div>

  </div>
</div>
