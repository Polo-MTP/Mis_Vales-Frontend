<div class="layout-container">

  <div class="dash-card">
    <h1 class="text-2xl font-black text-slate-100 tracking-tight">Historial de Puntos</h1>
    <p class="text-xs text-slate-400 font-medium mt-1">Movimientos que forman tu saldo actual de puntos.</p>
  </div>

  <div *ngIf="cargando()" class="state-loading">Cargando historial...</div>

  <div *ngIf="!cargando() && error()" class="bg-red-950/40 text-red-300 border border-red-800/60 rounded-2xl p-4 text-sm">
    {{ error() }}
  </div>

  <div *ngIf="!cargando() && !error() && movimientos().length === 0" class="state-empty">
    Todavía no tienes movimientos de puntos.
  </div>

  <div *ngIf="!cargando() && !error() && movimientos().length > 0" class="space-y-3">
    <div *ngFor="let m of movimientos()" class="list-card-item cursor-default">
      <div>
        <p class="font-bold text-slate-100">{{ m.motivo || m.tipo }}</p>
        <p class="text-xs text-slate-400 mt-0.5">{{ m.created_at | date:'short' }}<span *ngIf="m.registrado_por_nombre"> · {{ m.registrado_por_nombre }}</span></p>
      </div>
      <span class="text-lg font-black shrink-0" [class.text-emerald-400]="m.cantidad > 0" [class.text-red-400]="m.cantidad < 0">
        {{ m.cantidad > 0 ? '+' : '' }}{{ m.cantidad }}
      </span>
    </div>
  </div>

  <!-- Paginación -->
  <app-pagination 
    *ngIf="!cargando() && !error() && paginacion() && paginacion()!.last_page > 1"
    [currentPage]="paginacion()?.current_page || 1"
    [lastPage]="paginacion()?.last_page || 1"
    [loading]="cargando()"
    (pageChange)="cambiarPagina($event)">
  </app-pagination>

</div>
