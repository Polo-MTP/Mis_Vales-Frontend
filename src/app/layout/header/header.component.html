<header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Logo y Rol -->
      <div class="flex items-center gap-3">
        <a [routerLink]="homeRoute" class="text-lg font-black text-slate-100 tracking-wider hover:opacity-90 transition-opacity">
          SISTEMA
        </a>
        <span *ngIf="authService.userRole()" 
              [class]="getRoleBadgeClass()"
              class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">
          {{ authService.userRole() }}
        </span>
      </div>

      <!-- Menú Desktop (Visibilidad superior a 1024px) -->
      <nav class="hidden lg:flex items-center gap-1">
        <ng-container *ngTemplateOutlet="menuItems"></ng-container>
      </nav>

      <!-- Usuario y Logout Desktop -->
      <div class="hidden lg:flex items-center gap-3">
        <span class="text-xs text-slate-300 font-medium">
          {{ authService.currentUser()?.name }}
        </span>
        <button type="button" (click)="logout()" class="btn-outline text-xs py-1.5 px-3">
          Cerrar Sesión
        </button>
      </div>

      <!-- Botón Hamburguesa (Móvil y Tablet) -->
      <div class="flex lg:hidden">
        <button type="button" (click)="toggleMenu()" 
                class="p-2 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!menuAbierto()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            <path *ngIf="menuAbierto()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Menú desplegable para Tablet/Móvil -->
  <div *ngIf="menuAbierto()" class="lg:hidden border-t border-slate-800 bg-slate-900/95 backdrop-blur px-4 pt-3 pb-6 space-y-3">
    <nav class="flex flex-col gap-1" (click)="cerrarMenu()">
      <ng-container *ngTemplateOutlet="menuItems"></ng-container>
    </nav>
    <div class="pt-4 border-t border-slate-800 flex items-center justify-between">
      <span class="text-xs text-slate-400">{{ authService.currentUser()?.name }}</span>
      <button type="button" (click)="logout()" class="text-xs font-bold text-red-400 hover:text-red-300">
        Cerrar Sesión
      </button>
    </div>
  </div>
</header>

<!-- Menú según el rol -->
<ng-template #menuItems>
  <ng-container [ngSwitch]="authService.userRole()">
    
    <!-- Rutas Coordinador -->
    <ng-container *ngSwitchCase="'Coordinador'">
      <a routerLink="/coordinador/dashboard" routerLinkActive="bg-slate-800 text-blue-400" 
         class="px-3 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:text-slate-100 hover:bg-slate-800/60 transition-all">
        Dashboard
      </a>
      <a routerLink="/coordinador/solicitudes/nueva" routerLinkActive="bg-slate-800 text-blue-400"
         class="px-3 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:text-slate-100 hover:bg-slate-800/60 transition-all">
        Nueva Solicitud
      </a>
    </ng-container>

    <!-- Rutas Verificador -->
    <ng-container *ngSwitchCase="'Verificador'">
      <a routerLink="/verificador/dashboard" routerLinkActive="bg-slate-800 text-blue-400"
         class="px-3 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:text-slate-100 hover:bg-slate-800/60 transition-all">
        Dashboard
      </a>
      <a routerLink="/verificador/inspecciones" routerLinkActive="bg-slate-800 text-blue-400"
         class="px-3 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:text-slate-100 hover:bg-slate-800/60 transition-all">
        Inspecciones
      </a>
    </ng-container>

  </ng-container>
</ng-template>
